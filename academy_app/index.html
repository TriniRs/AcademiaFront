<!DOCTYPE html>
<html lang="es" data-theme="tech-neon">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CODEACADEMY — Academia de Frontend</title>
  <meta name="description" content="Academia online de programación frontend. Engineered for Precision." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    .material-symbols-outlined.md-dark { color: inherit; }
  </style>
</head>
<body>
  <!-- Top App Bar -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand" data-nav-home>
        <span class="material-symbols-outlined brand-icon">terminal</span>
        <span class="brand-text">CODEACADEMY</span>
      </a>

      <button class="menu-toggle material-symbols-outlined" id="menuToggle" aria-label="Menú">menu</button>

      <nav class="nav" id="mainNav">
        <a href="#/" data-nav="home">Inicio</a>
        <a href="#/prueba/html" data-nav="prueba">Prueba en línea</a>
      </nav>

      <div class="theme-selector" id="themeSelector">
        <button class="theme-trigger" id="themeTrigger" aria-label="Cambiar tema">
          <span class="label-caps">Tema</span>
          <span class="material-symbols-outlined">palette</span>
        </button>
        <div class="theme-dropdown" id="themeDropdown">
          <!-- Options injected via JS -->
        </div>
      </div>
    </div>
  </header>

  <!-- App View -->
  <main class="app">
    <div class="container" id="viewContainer"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="material-symbols-outlined brand-icon">terminal</span>
        <span class="brand-text">CODEACADEMY</span>
      </div>
      <p class="footer-copy code-sm">© 2026 Frontend Academy. Engineered for Precision.</p>
      <nav class="footer-nav">
        <a href="#">Documentación</a>
        <a href="#">Changelog</a>
        <a href="#">Privacidad</a>
        <a href="#">Soporte</a>
      </nav>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
