<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CODEACADEMY - Quiz Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Geist:wght@600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#cfbcff",
                      "background": "#141218",
                      "inverse-primary": "#6750a4",
                      "tertiary": "#e7c365",
                      "inverse-on-surface": "#322f35",
                      "on-secondary-container": "#bfb2da",
                      "surface-container-highest": "#36343a",
                      "on-surface": "#e6e0e9",
                      "on-error": "#690005",
                      "on-tertiary-container": "#503d00",
                      "surface-container-high": "#2b292f",
                      "on-error-container": "#ffdad6",
                      "inverse-surface": "#e6e0e9",
                      "error-container": "#93000a",
                      "surface-bright": "#3b383e",
                      "surface-container-low": "#1d1b20",
                      "surface-container": "#211f24",
                      "on-tertiary-fixed-variant": "#594400",
                      "tertiary-fixed": "#ffdf93",
                      "primary-fixed-dim": "#cfbcff",
                      "tertiary-fixed-dim": "#e7c365",
                      "on-primary-fixed": "#22005d",
                      "on-surface-variant": "#cbc4d2",
                      "error": "#ffb4ab",
                      "tertiary-container": "#c9a74d",
                      "on-primary-container": "#e0d2ff",
                      "on-background": "#e6e0e9",
                      "outline": "#948e9c",
                      "primary-container": "#6750a4",
                      "on-secondary": "#342b4b",
                      "on-secondary-fixed": "#1f1635",
                      "on-primary-fixed-variant": "#4f378a",
                      "secondary-fixed": "#e9ddff",
                      "outline-variant": "#494551",
                      "secondary": "#cdc0e9",
                      "on-secondary-fixed-variant": "#4b4263",
                      "on-tertiary": "#3e2e00",
                      "surface-container-lowest": "#0f0d13",
                      "secondary-container": "#4d4465",
                      "on-primary": "#381e72",
                      "primary": "#cfbcff",
                      "surface-dim": "#141218",
                      "surface": "#141218",
                      "surface-variant": "#36343a",
                      "secondary-fixed-dim": "#cdc0e9",
                      "on-tertiary-fixed": "#241a00",
                      "primary-fixed": "#e9ddff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "md": "1.5rem",
                      "xs": "0.5rem",
                      "lg": "2.5rem",
                      "xl": "4rem",
                      "container-max": "1280px",
                      "sm": "1rem",
                      "gutter": "24px",
                      "base": "4px"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Geist"
                      ],
                      "code-sm": [
                              "JetBrains Mono"
                      ],
                      "label-caps": [
                              "Inter"
                      ],
                      "display": [
                              "Geist"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Geist"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "1.5",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "1.3",
                                      "fontWeight": "600"
                              }
                      ],
                      "code-sm": [
                              "14px",
                              {
                                      "lineHeight": "1.4",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "1",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"
                              }
                      ],
                      "display": [
                              "48px",
                              {
                                      "lineHeight": "1.1",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "1.6",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "1.2",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 transition-all duration-300">
<div class="flex justify-between items-center px-lg h-16 w-full max-w-container-max mx-auto">
<div class="flex items-center gap-xs cursor-pointer hover:bg-primary/10 hover:text-primary transition-all duration-300 p-2 rounded active:scale-95">
<span class="material-symbols-outlined text-primary dark:text-primary">terminal</span>
<span class="font-headline-md text-headline-md font-bold tracking-tighter text-primary dark:text-primary">CODEACADEMY</span>
</div>
<button aria-label="Switch Theme" class="flex items-center gap-xs text-on-surface-variant hover:text-primary hover:bg-primary/10 transition-all duration-300 p-2 rounded-full active:scale-95" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined">light_mode</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-xl flex items-center justify-center px-md sm:px-lg">
<!-- Quiz Layout Container -->
<div class="w-full max-w-[720px] mx-auto bg-surface-container-low rounded-xl border border-outline-variant/30 p-lg sm:p-xl shadow-xl flex flex-col gap-lg transition-all duration-300 hover:border-primary/50 relative overflow-hidden">
<!-- Decorative Glow Element -->
<div class="absolute -top-24 -left-24 w-48 h-48 bg-primary opacity-5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header & Progress -->
<div class="flex flex-col gap-sm relative z-10">
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">React Fundamentals</span>
<span class="font-code-sm text-code-sm text-on-surface-variant">Question 1/10</span>
</div>
<!-- Progress Bar Track -->
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<!-- Progress Fill -->
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out shadow-[0_0_8px_rgba(207,188,255,0.6)]" style="width: 10%;"></div>
</div>
</div>
<!-- Question Area -->
<div class="relative z-10 my-md">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">What is the primary purpose of the <code class="font-code-sm text-code-sm text-primary bg-primary/10 px-2 py-1 rounded-md mx-1 border border-primary/20">'useEffect'</code> hook in React?</h1>
</div>
<!-- Options Area -->
<div class="flex flex-col gap-md relative z-10" id="quiz-options">
<!-- Option A -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="quiz_option" type="radio" value="A"/>
<div class="w-full bg-surface-container-high border border-outline-variant/30 p-md rounded-lg flex items-center gap-md transition-all duration-300 peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_15px_rgba(207,188,255,0.2)] hover:border-primary/50 hover:bg-surface-container-highest">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-surface-variant text-on-surface-variant font-code-sm text-code-sm peer-checked:bg-on-primary peer-checked:text-primary transition-colors duration-300 group-hover:text-primary">
                            A
                        </div>
<span class="font-body-lg text-body-lg text-on-surface peer-checked:text-on-primary transition-colors duration-300">To handle state management in functional components.</span>
</div>
</label>
<!-- Option B -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="quiz_option" type="radio" value="B"/>
<div class="w-full bg-surface-container-high border border-outline-variant/30 p-md rounded-lg flex items-center gap-md transition-all duration-300 peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_15px_rgba(207,188,255,0.2)] hover:border-primary/50 hover:bg-surface-container-highest">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-surface-variant text-on-surface-variant font-code-sm text-code-sm peer-checked:bg-on-primary peer-checked:text-primary transition-colors duration-300 group-hover:text-primary">
                            B
                        </div>
<span class="font-body-lg text-body-lg text-on-surface peer-checked:text-on-primary transition-colors duration-300">To perform side effects in functional components.</span>
</div>
</label>
<!-- Option C -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="quiz_option" type="radio" value="C"/>
<div class="w-full bg-surface-container-high border border-outline-variant/30 p-md rounded-lg flex items-center gap-md transition-all duration-300 peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_15px_rgba(207,188,255,0.2)] hover:border-primary/50 hover:bg-surface-container-highest">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-surface-variant text-on-surface-variant font-code-sm text-code-sm peer-checked:bg-on-primary peer-checked:text-primary transition-colors duration-300 group-hover:text-primary">
                            C
                        </div>
<span class="font-body-lg text-body-lg text-on-surface peer-checked:text-on-primary transition-colors duration-300">To optimize rendering performance by memoizing values.</span>
</div>
</label>
<!-- Option D -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="quiz_option" type="radio" value="D"/>
<div class="w-full bg-surface-container-high border border-outline-variant/30 p-md rounded-lg flex items-center gap-md transition-all duration-300 peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_15px_rgba(207,188,255,0.2)] hover:border-primary/50 hover:bg-surface-container-highest">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-surface-variant text-on-surface-variant font-code-sm text-code-sm peer-checked:bg-on-primary peer-checked:text-primary transition-colors duration-300 group-hover:text-primary">
                            D
                        </div>
<span class="font-body-lg text-body-lg text-on-surface peer-checked:text-on-primary transition-colors duration-300">To directly manipulate the DOM elements.</span>
</div>
</label>
</div>
<!-- Action Area -->
<div class="mt-md pt-lg border-t border-outline-variant/20 flex justify-end relative z-10">
<button class="bg-surface-container-highest text-on-surface-variant hover:text-primary hover:bg-primary/10 border border-outline-variant/50 hover:border-primary/50 font-label-caps text-label-caps py-sm px-lg rounded-full flex items-center gap-xs transition-all duration-300 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed group">
                    Next Question
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        // Simple script to handle theme toggle visual feedback on the icon
        document.querySelector('button[aria-label="Switch Theme"]').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            if (document.documentElement.classList.contains('dark')) {
                icon.textContent = 'light_mode';
            } else {
                icon.textContent = 'dark_mode';
            }
        });
    </script>
</body></html>
